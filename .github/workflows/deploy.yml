deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy FastAPI to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.233.134.52
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          # request_pty: false is the default and correct here.
          # A PTY would make the runner wait for interactive input — leave it off.
          script: |
            set -e  # Fail fast: any non-zero exit aborts the script

            cd ~/app
            git pull origin main

            # Re-install deps if requirements.txt changed
            source venv/bin/activate
            pip install -r requirements.txt --quiet

            # Hand the restart off to systemd (PID 1) and return immediately.
            # The SSH session has zero involvement in the Uvicorn process lifetime.
            sudo systemctl restart fastapi

            # Optional: verify the service actually came up before reporting success
            sleep 2
            sudo systemctl is-active --quiet fastapi \
              && echo "✅ FastAPI service is running" \
              || { echo "❌ FastAPI service failed to start"; sudo journalctl -u fastapi -n 20 --no-pager; exit 1; }
