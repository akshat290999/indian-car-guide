name: CI/CD Deployment Pipeline
on:
  push:
    branches: [ main ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync Frontend Build to S3
        run: |
          # Sync hashed assets (JS/CSS) with a long cache lifetime — content hash
          # in the filename guarantees freshness; browsers can cache indefinitely.
          aws s3 sync frontend/dist/assets/ \
            s3://indian-car-guide-frontend-1779267092/assets/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          # Sync everything else (images, favicon, etc.) with a moderate TTL.
          aws s3 sync frontend/dist/ \
            s3://indian-car-guide-frontend-1779267092/ \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public, max-age=86400"

          # index.html must NEVER be cached — it is the entry-point that
          # references hashed bundle names, so browsers must always fetch
          # the latest version to pick up new deploys.
          aws s3 cp frontend/dist/index.html \
            s3://indian-car-guide-frontend-1779267092/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E3R33265D081BW --paths "/*"

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy FastAPI to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.233.134.52
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ~/app

            # Hard-sync to remote main
            git fetch origin main
            git reset --hard origin/main

            # ── One-time surgical fix for stale root-level files ──────────────
            # The EC2 repo root contained an old main.py and database/ folder
            # (untracked, so git reset never removed them). The systemd service
            # ran uvicorn from WorkingDirectory=/home/ubuntu/app, which imported
            # those stale files instead of backend/main.py + backend/database/.
            # Remove them permanently and redirect the service to backend/.
            rm -f  ~/app/main.py
            rm -rf ~/app/database/
            rm -f  ~/app/download_images.py ~/app/patch_cars_data.py ~/app/image_results.json

            # Update systemd WorkingDirectory to backend/ if it still points to root
            if grep -q 'WorkingDirectory=/home/ubuntu/app$' /etc/systemd/system/fastapi.service; then
              sudo sed -i \
                's|WorkingDirectory=/home/ubuntu/app$|WorkingDirectory=/home/ubuntu/app/backend|' \
                /etc/systemd/system/fastapi.service
              echo "✏️  Updated fastapi.service WorkingDirectory → backend/"
              sudo systemctl daemon-reload
            fi

            source ~/app/venv/bin/activate
            [ -f ~/app/backend/requirements.txt ] && pip install -r ~/app/backend/requirements.txt --quiet || true

            sudo systemctl restart fastapi

            sleep 3
            sudo systemctl is-active --quiet fastapi \
              && echo "✅ FastAPI service is running" \
              || { echo "❌ FastAPI service failed"; sudo systemctl status fastapi; exit 1; }

            echo "🔖 EC2 now at: $(git rev-parse --short HEAD)"
            echo "=== cars_data.py Creta check ==="
            grep '_CRETA_COLORS' ~/app/backend/database/cars_data.py
