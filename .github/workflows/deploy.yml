name: CI/CD Deployment Pipeline
on:
  push:
    branches: [ main ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync Frontend Build to S3
        run: |
          aws s3 sync frontend/dist/ s3://indian-car-guide-frontend-1779267092 --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E3R33265D081BW --paths "/*"

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy FastAPI to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.233.134.52
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            # ── Discover where FastAPI actually runs from ──────────────────────
            echo "=== systemd service file ==="
            cat /etc/systemd/system/fastapi.service || cat /lib/systemd/system/fastapi.service || echo "service file not found at standard paths"

            echo "=== running uvicorn process ==="
            ps aux | grep uvicorn | grep -v grep || echo "no uvicorn process found"

            echo "=== git repos on this host ==="
            find /home/ubuntu -name ".git" -maxdepth 4 -type d 2>/dev/null || true
            find /root -name ".git" -maxdepth 4 -type d 2>/dev/null || true

            echo "=== ~/app contents ==="
            ls ~/app 2>/dev/null || echo "~/app does not exist"

            cd ~/app

            # Hard-sync to remote main
            git fetch origin main
            git reset --hard origin/main

            source venv/bin/activate
            [ -f requirements.txt ] && pip install -r requirements.txt --quiet || true

            sudo systemctl restart fastapi

            sleep 3
            sudo systemctl is-active --quiet fastapi \
              && echo "✅ FastAPI service is running" \
              || { echo "❌ FastAPI service failed to start"; sudo systemctl status fastapi; exit 1; }

            echo "🔖 EC2 now at: $(git rev-parse --short HEAD)"
            echo "=== cars_data.py first 3 lines ==="
            head -3 ~/app/backend/database/cars_data.py 2>/dev/null || echo "file not found at ~/app/backend/database/cars_data.py"
