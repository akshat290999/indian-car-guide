name: CI/CD Deployment Pipeline
on:
  push:
    branches: [ main ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync Frontend Build to S3
        run: |
          aws s3 sync frontend/dist/ s3://indian-car-guide-frontend-1779267092 --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E3R33265D081BW --paths "/*"

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy FastAPI to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.233.134.52
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ~/app
            git pull origin main

            source venv/bin/activate
            pip install -r requirements.txt --quiet

            sudo systemctl restart fastapi

            sleep 2
            sudo systemctl is-active --quiet fastapi \
              && echo "✅ FastAPI service is running" \
              || { echo "❌ FastAPI service failed to start"; sudo journalctl -u fastapi -n 20 --no-pager; exit 1; }
