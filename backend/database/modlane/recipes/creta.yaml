# If mods/creta.yaml changes, these combined figures need a manual recheck
# until that automation exists.

- id: creta-stealth-edition
  car_model: Creta
  name: Creta Stealth Edition
  mod_ids:
    - creta-chrome-delete-blackout
    - creta-window-tint-sun-film
    - creta-alloy-wheel-upgrade-17-18in
    - creta-interior-ambient-lighting
  combined_price_range:
    min_inr: 43500
    max_inr: 97000
    confidence: editorial_judgment_only
    sample_size: 0
  combined_warranty_risk: amber
  combined_road_clearance_risk: amber
  combined_rto_risk_baseline: red
  style_tags: [stealth, subtle]
  # Worked example of why worst-of matters: 3 of these 4 mods are Green/Amber
  # on their own, but the window-tint component is Red (Supreme Court 2012
  # ban), so the whole bundle is Red. A buyer assembling this look from
  # individual mod pages could easily miss that the bundle, as a package,
  # carries a real challan/seizure risk — which is exactly the failure mode
  # this recipe-level score exists to surface.

