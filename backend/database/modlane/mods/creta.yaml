  fitment_notes: >
    Boot-mounted subwoofer + amp, wired off a dedicated fused circuit from
    the battery. Reported battery-drain cases trace almost entirely to poor
    installation (undersized wiring, no auto turn-off synced to ignition,
    tapping the original wiring loom directly) rather than to subwoofers
    being inherently unsafe.
  warranty_risk:
    rating: amber
    rationale: >
      Real forum/dealer reports exist of manufacturers declining a battery
      warranty claim on the grounds that an aftermarket subwoofer/amp caused
      the failure. Risk is installation-quality-dependent: a separate,
      correctly-fused power run leaves the factory wiring untouched and is
      lower-risk than tapping the original loom.
