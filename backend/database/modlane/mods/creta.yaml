  fitment_notes: >
    Bolts to the front bumper/chassis mounts. Widely sold in the aftermarket
    accessory trade despite being banned — buyers should know this before
    paying for one, not find out at their next fitness-certificate renewal.
  warranty_risk:
    rating: amber
    rationale: Front-mount hardware can interfere with the crash sensor/airbag trigger zone on some platforms; not confirmed Creta-specific, flagged as a general risk pending direct sourcing.
    sources: []
    confidence: editorial_judgment_only
    last_reviewed: "2026-09-19"
  road_clearance_risk:
    rating: green
    rationale: No impact on underbody ground clearance; it is a forward projection, not a lowering modification.
    sources: []
    confidence: editorial_judgment_only
    last_reviewed: "2026-09-19"
  rto_risk:
    baseline:
      rating: red
      rationale: >
        Crash guards/bull bars have been banned on Indian passenger cars since
        a December 2017 MoRTH advisory directing all state transport
        commissioners to enforce Section 52 of the Motor Vehicles Act, 1988
        (no alteration from registered specification) against them. The
        Supreme Court reinforced Section 52 enforcement in 2019, giving RTOs
        authority to impound non-compliant vehicles on the spot. A vehicle
        fitted with one will fail its fitness-certificate inspection outright.
        Under Section 182A(4) (2019 amendment), unauthorised alterations carry
        up to 6 months' imprisonment or a ₹5,000 fine per alteration.
        Comprehensive insurers can also deny a claim if the bull bar is judged
        to have affected crash behaviour in an accident.
      sources:
        - label: "Bull Bars Are Illegal in India (2026): Fines, Airbag Risk, Insurance Impact"
          url: https://nandicaraccessories.com/blogs/news/that-rs-12-000-bull-bar-makes-your-crash-worse-not-better-the-crumple-zone-physics-the-section-52-ban-and-the-insurance-claim-you-will-lose-india-2026
          source_type: government_document
          date_observed: "2026-09-19"
